name: MLOps Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 steps/ model/ pipelines/ --max-line-length=120 --ignore=E501,W503,E402,W504,E302,W292,W293,W391

      - name: Verify pipeline imports
        run: |
          pip install zenml evidently mlflow sqlalchemy_utils
          pip install zenml evidently mlflow
          python -c "from steps.drift_detection import detect_data_drift; print('Drift detection import OK')"
          python -c "from pipelines.training_pipeline import train_pipeline; print('Training pipeline import OK')"
          python -c "from pipelines.deployment_pipeline import continuous_deployment_pipeline; print('Deployment pipeline import OK')"
