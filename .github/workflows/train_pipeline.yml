name: MLOps Pipeline CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint with flake8
        run: |
          flake8 steps/ model/ pipelines/ --max-line-length=120 --ignore=E501,W503,E402,W504,E302,W292,W293,W391

      - name: Verify syntax of all pipeline files
        run: |
          python -m py_compile steps/drift_detection.py && echo "drift_detection.py OK"
          python -m py_compile steps/model_train.py && echo "model_train.py OK"
          python -m py_compile steps/evaluation.py && echo "evaluation.py OK"
          python -m py_compile steps/clean_data.py && echo "clean_data.py OK"
          python -m py_compile steps/ingest_data.py && echo "ingest_data.py OK"
          python -m py_compile model/model_dev.py && echo "model_dev.py OK"
          python -m py_compile model/data_cleaning.py && echo "data_cleaning.py OK"
          python -m py_compile model/evaluation.py && echo "evaluation.py OK"
          python -m py_compile pipelines/training_pipeline.py && echo "training_pipeline.py OK"
          python -m py_compile pipelines/deployment_pipeline.py && echo "deployment_pipeline.py OK"
          echo "All files passed syntax check"
